# SeerrHA - all-in-one package
#
# Drop this file into `config/packages/` and enable packages in
# configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Then restart Home Assistant - rest_command is not loaded until the key exists,
# so there is nothing to reload the first time. Later edits: rest_command.reload.
#
# Edit the three values under `variables:` in the automation below - the Seerr
# URL, the API key and your notify service. Nothing else needs changing.
#
# Prefer the key in secrets.yaml? Set the X-Api-Key header below to
# `!secret seerr_api_key`; the api_key variable is then ignored.
#
# This is the minimal version: notification in, decision out. The blueprint
# (blueprints/automation/seerrha/) additionally offers configurable button
# labels, a confirmation notification, an "available" alert and a per-instance
# action prefix. Use the blueprint if you want those.

rest_command:
  seerrha_request_action:
    url: "{{ base_url }}/api/v1/request/{{ request_id }}/{{ cmd }}"
    method: POST
    headers:
      X-Api-Key: "{{ api_key }}"
      Content-Type: application/json
    payload: "{}"

  # Read-only smoke test: 200 on a valid key, whatever requests exist.
  seerrha_test:
    url: "{{ base_url }}/api/v1/request?take=1"
    method: GET
    headers:
      X-Api-Key: "{{ api_key }}"

automation:
  - alias: SeerrHA - request approval
    description: Notification with poster and Approve/Decline buttons + response handling
    mode: queued
    max: 10
    variables:
      # ---- the only three lines you need to edit ----
      seerr_url: http://IP_SEERR:5055
      seerr_api_key: YOUR_SEERR_API_KEY
      phone: notify.mobile_app_your_phone
    triggers:
      - trigger: state
        entity_id: event.overseerr_last_media_event
        not_from:
          - unknown
          - unavailable
        id: request
      - trigger: event
        event_type: mobile_app_notification_action
        id: response
    conditions:
      - condition: template
        value_template: >-
          {{ (trigger.id == 'request'
              and trigger.to_state.attributes.event_type == 'pending')
             or (trigger.id == 'response'
              and trigger.event.data.action is string
              and trigger.event.data.action.startswith('SEERR_')) }}
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'request' }}"
            sequence:
              - variables:
                  rid: "{{ trigger.to_state.attributes['request']['request_id'] }}"
                  who: "{{ trigger.to_state.attributes['request']['requested_by_username'] }}"
                  title: "{{ trigger.to_state.attributes.subject }}"
                  poster: "{{ trigger.to_state.attributes.entity_picture }}"
                  seasons: >-
                    {{ trigger.to_state.attributes.extra
                       | selectattr('name', 'eq', 'Requested Seasons')
                       | map(attribute='value') | first | default('', true) }}
              - action: "{{ phone }}"
                data:
                  title: "{{ title }}"
                  message: >-
                    Requested by: {{ who }}{% if seasons %} - seasons {{ seasons }}{% endif %}
                  data:
                    image: "{{ poster }}"
                    tag: "seerr_{{ rid }}"
                    channel: Seerr
                    importance: high
                    sticky: true
                    actions:
                      - action: "SEERR_APPROVE_{{ rid }}"
                        title: Approve
                      - action: "SEERR_DECLINE_{{ rid }}"
                        title: Decline
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'response' }}"
            sequence:
              - variables:
                  rid: "{{ trigger.event.data.action.split('_')[2] }}"
                  cmd: >-
                    {{ 'approve' if 'APPROVE' in trigger.event.data.action else 'decline' }}
              - action: rest_command.seerrha_request_action
                data:
                  base_url: "{{ seerr_url }}"
                  api_key: "{{ seerr_api_key }}"
                  request_id: "{{ rid }}"
                  cmd: "{{ cmd }}"
                response_variable: result
                continue_on_error: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ result is defined and result.status is defined
                         and result.status in [200, 201] }}
                then:
                  - action: "{{ phone }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "seerr_{{ rid }}"
                else:
                  # Leave the prompt up - the request is still undecided.
                  - action: "{{ phone }}"
                    data:
                      title: Seerr - decision failed
                      message: >-
                        Could not {{ cmd }} request #{{ rid }}
                        ({{ result.status if result is defined and result.status is defined
                            else 'no response' }}). It is still pending.
                      data:
                        tag: "seerr_error_{{ rid }}"
                        channel: Seerr
                        importance: high
