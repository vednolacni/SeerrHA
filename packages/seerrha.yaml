# SeerrHA - all-in-one package
#
# Drop this file into `config/packages/` and enable packages in
# configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Then restart Home Assistant (rest_command definitions are only read at boot).
#
# Replace IP_SEERR and add `seerr_api_key` to secrets.yaml.

rest_command:
  seerrha_request_action:
    url: "http://IP_SEERR:5055/api/v1/request/{{ request_id }}/{{ cmd }}"
    method: POST
    headers:
      X-Api-Key: !secret seerr_api_key
      Content-Type: application/json
    payload: "{}"

  seerrha_test:
    url: "http://IP_SEERR:5055/api/v1/request/35"
    method: GET
    headers:
      X-Api-Key: !secret seerr_api_key

automation:
  - alias: SeerrHA - request approval
    description: Notification with poster and Approve/Decline buttons + response handling
    mode: queued
    max: 10
    variables:
      phone: notify.mobile_app_your_phone
    triggers:
      - trigger: state
        entity_id: event.overseerr_last_media_event
        not_from:
          - unknown
          - unavailable
        id: request
      - trigger: event
        event_type: mobile_app_notification_action
        id: response
    conditions:
      - condition: template
        value_template: >-
          {{ (trigger.id == 'request'
              and trigger.to_state.attributes.event_type == 'pending')
             or (trigger.id == 'response'
              and trigger.event.data.action is string
              and trigger.event.data.action.startswith('SEERR_')) }}
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'request' }}"
            sequence:
              - variables:
                  rid: "{{ trigger.to_state.attributes['request']['request_id'] }}"
                  who: "{{ trigger.to_state.attributes['request']['requested_by_username'] }}"
                  title: "{{ trigger.to_state.attributes.subject }}"
                  poster: "{{ trigger.to_state.attributes.entity_picture }}"
                  seasons: >-
                    {{ trigger.to_state.attributes.extra
                       | selectattr('name', 'eq', 'Requested Seasons')
                       | map(attribute='value') | first | default('', true) }}
              - action: "{{ phone }}"
                data:
                  title: "{{ title }}"
                  message: >-
                    Requested by: {{ who }}{% if seasons %} - seasons {{ seasons }}{% endif %}
                  data:
                    image: "{{ poster }}"
                    tag: "seerr_{{ rid }}"
                    channel: Seerr
                    importance: high
                    sticky: true
                    actions:
                      - action: "SEERR_APPROVE_{{ rid }}"
                        title: Approve
                      - action: "SEERR_DECLINE_{{ rid }}"
                        title: Decline
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'response' }}"
            sequence:
              - variables:
                  rid: "{{ trigger.event.data.action.split('_')[2] }}"
                  cmd: >-
                    {{ 'approve' if 'APPROVE' in trigger.event.data.action else 'decline' }}
              - action: rest_command.seerrha_request_action
                data:
                  request_id: "{{ rid }}"
                  cmd: "{{ cmd }}"
              - action: "{{ phone }}"
                data:
                  message: clear_notification
                  data:
                    tag: "seerr_{{ rid }}"
