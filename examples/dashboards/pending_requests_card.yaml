# SeerrHA - pending requests dashboard card
#
# A vertical stack showing the last Seerr event (poster + who requested what)
# plus quick approve/decline buttons wired to script.seerrha_decide_request.
#
# The picture-entity card reads `entity_picture` straight from the event
# entity - no TMDB lookup needed.

type: vertical-stack
cards:
  - type: picture-entity
    entity: event.overseerr_last_media_event
    name: Last Seerr event
    show_state: true
    show_name: true
    camera_view: auto

  - type: markdown
    content: >-
      {% set e = states.event.overseerr_last_media_event %} {% if e %}

      ### {{ e.attributes.subject }}

      **Status:** {{ e.attributes.event_type }}

      **Requested by:** {{ e.attributes['request']['requested_by_username'] }}

      **Request ID:** {{ e.attributes['request']['request_id'] }}

      {% set seasons = e.attributes.extra
         | selectattr('name', 'eq', 'Requested Seasons')
         | map(attribute='value') | first | default('', true) %}

      {% if seasons %}**Seasons:** {{ seasons }}{% endif %}

      {% else %}

      _No Seerr event received yet._

      {% endif %}

  - type: horizontal-stack
    cards:
      - type: button
        name: Approve
        icon: mdi:check
        tap_action:
          action: perform-action
          perform_action: script.seerrha_decide_request
          data:
            request_id: >-
              {{ state_attr('event.overseerr_last_media_event', 'request')['request_id'] }}
            decision: approve
      - type: button
        name: Decline
        icon: mdi:close
        tap_action:
          action: perform-action
          perform_action: script.seerrha_decide_request
          data:
            request_id: >-
              {{ state_attr('event.overseerr_last_media_event', 'request')['request_id'] }}
            decision: decline
