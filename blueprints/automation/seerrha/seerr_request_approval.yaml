blueprint:
  name: SeerrHA - Approve or decline Seerr requests
  description: >-
    Sends an actionable mobile notification with poster art, requester name and
    **Approve** / **Decline** buttons whenever a new request lands in Seerr
    (Overseerr / Jellyseerr). Pressing a button POSTs the decision straight back
    to the Seerr API.


    **Prerequisites**

    1. The official **Seerr** (`overseerr`) integration is set up in Home Assistant.

    2. **CSRF Protection is disabled** in Seerr -> Settings -> General.

    3. The `rest_command.seerrha_request_action` command exists in your
    configuration. Copy
    [`examples/rest_commands.yaml`](https://github.com/vednolacni/SeerrHA/blob/main/examples/rest_commands.yaml)
    **unchanged** - the URL and key below are passed to it - and **restart**
    Home Assistant once after adding it.


    The official integration only ships `get_requests`, `request_media` and
    `search_media` - it cannot approve or decline. That part is done with
    `rest_command` against `POST /api/v1/request/{id}/approve|decline`.


    **Documentation**

    - [SeerrHA on GitHub](https://github.com/vednolacni/SeerrHA)

    - [Setup guide](https://github.com/vednolacni/SeerrHA/blob/main/docs/setup.md)

    - [Troubleshooting](https://github.com/vednolacni/SeerrHA/blob/main/docs/troubleshooting.md)
  domain: automation
  source_url: https://github.com/vednolacni/SeerrHA/blob/main/blueprints/automation/seerrha/seerr_request_approval.yaml
  input:
    seerr_settings:
      name: Seerr
      icon: mdi:movie-open-check
      collapsed: false
      input:
        event_entity:
          name: Seerr event entity
          description: >-
            The event entity created by the Seerr integration. The integration
            registers and overwrites the webhook in Seerr on every reload - do
            not edit that webhook by hand.
          default: event.overseerr_last_media_event
          selector:
            entity:
              filter:
                - domain: event
        seerr_url:
          name: Seerr URL
          description: >-
            Base URL of your Seerr server, e.g. `http://192.168.1.10:5055`.
            **No trailing slash.** This is passed to the REST command, so
            `rest_commands.yaml` needs no editing.
          selector:
            text:
        seerr_api_key:
          name: Seerr API key
          description: >-
            Seerr -> Settings -> General -> API Key.


            **Note:** blueprint inputs are stored in plain text in
            `automations.yaml` and appear in automation traces, so the key ends
            up in backups and diagnostics. To keep it in `secrets.yaml` instead,
            set the `X-Api-Key` header in your `rest_commands.yaml` to
            `!secret seerr_api_key` and leave this field blank - the value below
            is then ignored.
          default: ""
          selector:
            text:
              type: password
    notification_settings:
      name: Notification
      icon: mdi:cellphone-message
      collapsed: false
      input:
        notify_device:
          name: Phone
          description: >-
            The phone that gets the notification. Only devices running the
            Home Assistant Companion app are listed.


            Leave this empty if you fill in **Notify service** below instead.
          default: ""
          selector:
            device:
              filter:
                - integration: mobile_app
        notify_service:
          name: Notify service (advanced)
          description: >-
            **Leave this empty if you picked a Phone above.** It is only for the
            one thing the picker cannot express: a notification **group**
            covering several phones, e.g. `notify.all_phones`. Takes priority
            when both are set.


            It must be a notify **service** (`notify.mobile_app_pixel_9`), not a
            notify *entity* (`notify.pixel_9`) - entities only support
            `send_message` and cannot render images or action buttons.


            For several phones prefer one group here over creating a second
            automation from this blueprint - see "Action prefix" below for why.
          default: ""
          selector:
            text:
        approve_label:
          name: Approve button label
          default: Approve
          selector:
            text:
        decline_label:
          name: Decline button label
          default: Decline
          selector:
            text:
        notification_channel:
          name: Android notification channel
          description: Channel name used for grouping and per-channel sound settings.
          default: Seerr
          selector:
            text:
        sticky:
          name: Sticky notification
          description: >-
            Keep the notification on screen until a button is pressed instead of
            letting a swipe dismiss it (Android only).
          default: true
          selector:
            boolean:
    extra_features:
      name: Optional extras
      icon: mdi:tune
      collapsed: true
      input:
        confirm_decision:
          name: Confirmation notification
          description: >-
            Send a short follow-up notification after the decision has been
            POSTed, so you know the call actually went through.
          default: true
          selector:
            boolean:
        notify_available:
          name: Notify when media becomes available
          description: >-
            Send a notification when Seerr reports `available`, i.e. the content
            is ready to play. Seerr decides when that is, so it arrives well
            after the approval.
          default: false
          selector:
            boolean:
        action_prefix:
          name: Action prefix
          description: >-
            Prefix for the notification button identifiers, e.g.
            `SEERR_APPROVE_35`. Leave it alone unless you create **more than
            one** automation from this blueprint.


            The button press comes back as a plain event with no device
            information, so every automation built from this blueprint reacts to
            every press. Two automations sharing a prefix therefore send the
            decision to Seerr twice. Give each one its own prefix to keep them
            apart.


            Uppercase letters and digits only - **no underscores**.
          default: SEERR
          selector:
            text:

mode: queued
max: 10

variables:
  notify_device: !input notify_device
  notify_service: !input notify_service
  # The explicit service wins; otherwise derive it from the picked device.
  # device_attr(..., 'name') is the name the app registered with, which is what
  # the mobile_app notify service is named after - renaming the device in the
  # Home Assistant UI sets `name_by_user` and does not change the service.
  notify_target: >-
    {{ notify_service if notify_service else
       'notify.mobile_app_' ~ (device_attr(notify_device, 'name') | slugify) }}
  seerr_url: !input seerr_url
  seerr_api_key: !input seerr_api_key
  approve_label: !input approve_label
  decline_label: !input decline_label
  notification_channel: !input notification_channel
  sticky: !input sticky
  confirm_decision: !input confirm_decision
  notify_available: !input notify_available
  action_prefix: !input action_prefix

triggers:
  - trigger: state
    entity_id: !input event_entity
    not_from:
      - unknown
      - unavailable
    id: request
  - trigger: event
    event_type: mobile_app_notification_action
    id: response

conditions:
  - condition: template
    value_template: >-
      {{ (trigger.id == 'request'
          and trigger.to_state.attributes.event_type in
              (['pending', 'available'] if notify_available else ['pending']))
         or (trigger.id == 'response'
          and trigger.event.data.action is string
          and trigger.event.data.action.startswith(action_prefix ~ '_')) }}

actions:
  - choose:
      # --- A: new pending request -> actionable notification ---
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'request'
                 and trigger.to_state.attributes.event_type == 'pending' }}
        sequence:
          - variables:
              rid: "{{ trigger.to_state.attributes['request']['request_id'] }}"
              who: "{{ trigger.to_state.attributes['request']['requested_by_username'] }}"
              title: "{{ trigger.to_state.attributes.subject }}"
              poster: "{{ trigger.to_state.attributes.entity_picture }}"
              seasons: >-
                {{ trigger.to_state.attributes.extra
                   | selectattr('name', 'eq', 'Requested Seasons')
                   | map(attribute='value') | first | default('', true) }}
          - action: "{{ notify_target }}"
            data:
              title: "{{ title }}"
              message: >-
                {{ who }}{% if seasons %} - seasons {{ seasons }}{% endif %}
              data:
                image: "{{ poster }}"
                tag: "seerr_{{ rid }}"
                group: seerr
                channel: "{{ notification_channel }}"
                importance: high
                sticky: "{{ sticky }}"
                actions:
                  - action: "{{ action_prefix }}_APPROVE_{{ rid }}"
                    title: "{{ approve_label }}"
                  - action: "{{ action_prefix }}_DECLINE_{{ rid }}"
                    title: "{{ decline_label }}"

      # --- B: button pressed -> decision back to Seerr ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'response' }}"
        sequence:
          - variables:
              rid: "{{ trigger.event.data.action.split('_')[2] }}"
              cmd: >-
                {{ 'approve' if 'APPROVE' in trigger.event.data.action else 'decline' }}
          # continue_on_error so a connection error still reports back
          # instead of aborting the run silently.
          - action: rest_command.seerrha_request_action
            data:
              base_url: "{{ seerr_url }}"
              api_key: "{{ seerr_api_key }}"
              request_id: "{{ rid }}"
              cmd: "{{ cmd }}"
            response_variable: result
            continue_on_error: true
          - variables:
              ok: >-
                {{ result is defined and result.status is defined
                   and result.status in [200, 201] }}
              status: >-
                {{ result.status if result is defined and result.status is defined
                   else 'no response' }}
          - choose:
              # The POST went through - clear the prompt, optionally confirm.
              - conditions:
                  - condition: template
                    value_template: "{{ ok }}"
                sequence:
                  - action: "{{ notify_target }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "seerr_{{ rid }}"
                  - if:
                      - condition: template
                        value_template: "{{ confirm_decision }}"
                    then:
                      - action: "{{ notify_target }}"
                        data:
                          title: Seerr
                          message: >-
                            Request #{{ rid }} {{ 'approved' if cmd == 'approve' else 'declined' }}.
                          data:
                            tag: "seerr_result_{{ rid }}"
                            group: seerr
                            channel: "{{ notification_channel }}"
                            importance: default
            # The POST failed. Say so and leave the original notification up,
            # because the request is still sitting in Seerr undecided.
            default:
              - action: "{{ notify_target }}"
                data:
                  title: Seerr - decision failed
                  message: >-
                    Could not {{ cmd }} request #{{ rid }} ({{ status }}). It is
                    still pending - check the API key and that CSRF protection
                    is off in Seerr.
                  data:
                    tag: "seerr_error_{{ rid }}"
                    group: seerr
                    channel: "{{ notification_channel }}"
                    importance: high

      # --- C: media became available (optional) ---
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'request'
                 and trigger.to_state.attributes.event_type == 'available' }}
        sequence:
          - variables:
              title: "{{ trigger.to_state.attributes.subject }}"
              poster: "{{ trigger.to_state.attributes.entity_picture }}"
          - action: "{{ notify_target }}"
            data:
              title: "{{ title }}"
              message: Ready to watch.
              data:
                image: "{{ poster }}"
                group: seerr
                channel: "{{ notification_channel }}"
                importance: default
